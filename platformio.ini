; PlatformIO Project Configuration File -- ORBT Sensor Node (reduced)
;
; A trimmed-down copy of orbt-core-firmware's platformio.ini, keeping only
; the library dependencies actually needed by this reduced firmware:
; WiFi (built into arduino-esp32), NimBLE, sensor-fusion, and TinyCBOR
; (for CborTelemetry).
;
; This project targets a single board: ESP32-C6, ORBT PCB Mk5.0.

[env:sensor-node-mk50]
; Same pioarduino platform build as the full orbt-core-firmware project.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip

framework = arduino

; Provides the git commit hash as a build flag; harmless if not a git repo.
extra_scripts = pre:platformio_extra_script.py, post:platformio_extra_script.py

lib_deps =
  h2zero/NimBLE-Arduino@^2.3.6
  martinbudden/SensorFusion@^0.2.9
  martinbudden/VectorQuaternionMatrix@^0.4.5
  soburi/TinyCBOR@^0.5.3-arduino2
  makuna/NeoPixelBus@^2.8.4

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ESP32-C6 based board (ORBT PCB Mk5.0)
board = orbt_esp32c6
board_build.flash_size = 8MB
board_build.partitions = partitions_8MB_with_coredump.csv
build_flags =
    -D ORBT_PCB_VERSION=50
    -D CONFIG_IDF_TARGET_ESP32C6
